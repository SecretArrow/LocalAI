name: CodeQL

# Security scanning (java-kotlin) with a real build: CodeQL buildless
# extraction never actually picked up the Android Kotlin source sets
# (pre-migration runs produced a ~650 KiB database of XML/properties only),
# and after the AGP 9 migration it fails outright. Manual build mode
# compiles the Kotlin sources under CodeQL tracing, which extracts every
# module for real. The build is kept light (Kotlin compile tasks only —
# no NDK / native / packaging), so the job stays well under 10 minutes.
#
# Runs on push to main and weekly; PRs are deliberately NOT scanned here
# to keep the PR loop fast (CI + Quality already gate every PR).

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 7 * * 1' # weekly, offset from the CI schedule
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Set up Gradle (build cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Compile Kotlin sources under CodeQL tracing
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:compileDebugKotlin \
            :core:compileDebugKotlin \
            :api-server:compileKotlin

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
