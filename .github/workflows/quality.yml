name: Quality

# detekt static-analysis gate. The baseline (config/detekt/baseline.xml)
# snapshots all findings that existed when the gate was introduced, so only
# NEW issues fail the build. Findings are also uploaded to code scanning
# (Security tab) as SARIF, and failure diagnostics are exposed as the
# quality-logs artifact for the Auto-fix workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      regen-baseline:
        description: 'Regenerate the detekt baseline (accept all current findings) and commit it'
        type: boolean
        default: false

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  DETEKT_VERSION: '1.23.8'

jobs:
  detekt:
    name: detekt gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Download detekt CLI
        run: |
          curl -sSL -o /tmp/detekt.zip \
            "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}.zip"
          unzip -q /tmp/detekt.zip -d "$RUNNER_TEMP/detekt"

      - name: Run detekt (gate on new issues only)
        run: |
          set -o pipefail
          DETEKT_JAR="$(ls "$RUNNER_TEMP"/detekt/detekt-cli-*/lib/detekt-cli-*-all.jar)"
          java -jar "$DETEKT_JAR" \
            --input app/src/main,core/src/main,api-server/src/main \
            --config config/detekt/detekt.yml \
            --baseline config/detekt/baseline.xml \
            --parallel \
            --report txt:detekt.txt \
            --report xml:detekt.xml 2>&1 | tee detekt-console.log

      - name: Convert report to SARIF
        if: always()
        run: python3 scripts/detekt_to_sarif.py detekt.xml detekt.sarif "${{ github.event.repository.name }}"

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: detekt.sarif

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p quality-failure
          cp detekt.txt detekt-console.log quality-failure/ 2>/dev/null || true
          cp detekt.xml quality-failure/ 2>/dev/null || true
          {
            echo "commit: ${{ github.sha }}"
            echo "run_id: ${{ github.run_id }}"
            echo "branch: ${{ github.ref_name }}"
          } > quality-failure/meta.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quality-logs
          path: quality-failure/
          retention-days: 14

  regen-baseline:
    name: Regenerate detekt baseline
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.regen-baseline == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Download detekt CLI
        run: |
          curl -sSL -o /tmp/detekt.zip \
            "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}.zip"
          unzip -q /tmp/detekt.zip -d "$RUNNER_TEMP/detekt"

      - name: Regenerate baseline
        run: |
          DETEKT_JAR="$(ls "$RUNNER_TEMP"/detekt/detekt-cli-*/lib/detekt-cli-*-all.jar)"
          java -jar "$DETEKT_JAR" \
            --input app/src/main,core/src/main,api-server/src/main \
            --config config/detekt/detekt.yml \
            --create-baseline --baseline config/detekt/baseline.xml \
            --parallel
          echo "baseline now contains $(grep -c '<ID>' config/detekt/baseline.xml) entries"

      - name: Commit updated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/detekt/baseline.xml
          if git diff --cached --quiet; then
            echo "baseline unchanged"
            exit 0
          fi
          git commit -m "chore(quality): regenerate detekt baseline"
          git push origin HEAD:main
