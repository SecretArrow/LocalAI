name: Feature request
description: Suggest a new capability or improvement for LocalAI.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem you are facing
        first, then the solution you have in mind. The more context, the easier
        it is to evaluate and prioritize.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should LocalAI do, and how would it work or look?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you tried or thought about, and why they fall short.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, mockups, or anything else that helps.
