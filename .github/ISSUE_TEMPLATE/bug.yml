name: Bug report
description: Report something broken or behaving unexpectedly in LocalAI.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in LocalAI. Please fill in the
        fields below so it can be reproduced and fixed quickly. For questions and
        general help, use GitHub Discussions instead of an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and the exact steps to reproduce it.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: what-expected
    attributes:
      label: What did you expect to happen?
      description: The behavior you expected instead of the bug.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "see About screen, e.g. 0.1.0"
    validations:
      required: true
  - type: input
    id: android-version-device
    attributes:
      label: Android version and device
      placeholder: "e.g. Android 14, Pixel 8"
    validations:
      required: true
  - type: dropdown
    id: api-server
    attributes:
      label: API server used?
      description: Whether the on-device OpenAI-compatible API server was running when the bug occurred.
      options:
        - "No"
        - "Yes, HTTP"
        - "Yes, HTTPS"
      default: 0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional. Paste relevant log output; it is rendered as a code block. You can export logs from the Logs screen in the app.
      render: shell
  - type: checkboxes
    id: search-checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues (open and closed) and found no report of this bug.
          required: true
