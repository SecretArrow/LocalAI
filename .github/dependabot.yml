version: 2
updates:
  # Gradle dependencies (includes the gradle/libs.versions.toml version
  # catalog — Dependabot understands it natively and propagates bumps).
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # Bundle safe patch/minor bumps so the CI (and auto-fix) only runs once.
      patch-and-minor:
        update-types:
          - minor
          - patch
    # No breaking major bumps (the agp 9 / ktor 3 / okhttp 5 / compose-bom
    # 2026 class of updates) — majors are upgraded deliberately, by hand.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Hold Kotlin at 2.4.10: CodeQL 2.27.0 (latest CLI) rejects Kotlin
      # >= 2.4.20 during manual-build extraction ("Kotlin version 2.4.20 is
      # too recent"). Remove these ignores and bump Kotlin once a CodeQL
      # release supports 2.4.20+.
      - dependency-name: "org.jetbrains.kotlin.jvm"
        versions: ["2.4.20", "2.4.21", "2.4.30", "2.4.31"]
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
        versions: ["2.4.20", "2.4.21", "2.4.30", "2.4.31"]
      - dependency-name: "org.jetbrains.kotlin.plugin.serialization"
        versions: ["2.4.20", "2.4.21", "2.4.30", "2.4.31"]

  # GitHub Actions workflow versions (actions/checkout, setup-java, ...).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'chore(ci-deps)'
