# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
# Parallel execution and build cache for fast CI builds.
org.gradle.parallel=true
org.gradle.caching=true
# AndroidX
android.useAndroidX=true
# Only keep module-specific R classes (faster builds).
android.nonTransitiveRClass=true
# AGP 9: opt out of built-in Kotlin and apply the classic
# org.jetbrains.kotlin.android plugin instead. CodeQL's buildless
# (build-mode: none) Java/Kotlin extractor does not yet discover Kotlin
# source sets registered via AGP 9 built-in Kotlin, which made code
# scanning extract zero sources. The classic KGP setup keeps the fast
# buildless CodeQL workflow green. Revisit when CodeQL supports it.
android.builtInKotlin=false
kotlin.code.style=official
