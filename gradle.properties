# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
# Parallel execution and build cache for fast CI builds.
org.gradle.parallel=true
org.gradle.caching=true
# AndroidX
android.useAndroidX=true
# Only keep module-specific R classes (faster builds).
android.nonTransitiveRClass=true
# AGP 9 compatibility opt-outs: CodeQL's buildless (build-mode: none)
# Java/Kotlin extractor does not yet discover Kotlin source sets registered
# via AGP 9 built-in Kotlin, which made code scanning extract zero sources.
# We therefore keep the classic kotlin-android plugin, which on AGP 9
# requires both legacy flags:
#   android.builtInKotlin=false -> apply org.jetbrains.kotlin.android again
#   android.newDsl=false        -> restore legacy BaseExtension DSL for KGP
# Revisit both when CodeQL supports AGP 9 built-in Kotlin (must happen
# before an AGP 10 upgrade, which removes the newDsl opt-out).
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
